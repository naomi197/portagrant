name: Validate PortaGrant

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/portagrant
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --target wasm32-unknown-unknown --no-default-features
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check frontend/app.js
      - run: node --check scripts/deploy.mjs
      - run: node --check scripts/inspect.mjs
